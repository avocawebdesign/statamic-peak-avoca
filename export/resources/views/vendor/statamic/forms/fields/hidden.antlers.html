{{# A field with input_type hidden: kept in the form data and posted, never shown. The wrapper hides its label row too. #}}
<!-- /vendor/statamic/forms/fields/hidden.antlers.html -->
<input x-model="form.{{ handle }}" id="{{ id }}" type="hidden" name="{{ handle }}" value="{{ old ?? value }}">
<!-- End: /vendor/statamic/forms/fields/hidden.antlers.html -->
