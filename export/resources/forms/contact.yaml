honeypot_behavior: ignore
success_message: 'Thank you, we received your message and will contact you as soon as possible.'
title: Contact
fields:
  pages:
    -
      id: main
      show_previous_button: false
      sections:
        -
          fields:
            -
              handle: name
              field:
                display: Name
                type: name
                validate:
                  - required
                  - 'min:2'
                localizable: true
                width: 66
            -
              handle: email
              field:
                display: 'Email address'
                type: email
                validate:
                  - required
                localizable: true
                width: 66
            -
              handle: message_body
              field:
                display: Message
                type: long_answer
                validate:
                  - required
                  - 'min:5'
                localizable: true
            -
              handle: consent
              field:
                inline_label: 'I understand my details will be stored so you can get back to me.'
                display: Consent
                type: toggle
                validate:
                  - accepted
                visibility: hidden
honeypot: fax
connections:
  peak_email:
    -
      id: iwArpANx
      to: '{{ site_details:email ?? config:mail:from:address }}'
      reply_to: 'field:email'
      subject: 'Contact form received: [[ name ]]'
      body: 'A contact form has been sent.'
      show_submitted_data: true
      html: 'peak-tools-email::form'
      text: 'peak-tools-email::form_text'
    -
      id: p0bMnaXJ
      to: 'field:email'
      reply_to: '{{ site_details:email ?? config:mail:from:address }}'
      subject: 'Contact form sent'
      body: |-
        ### Dear {{ first\_name or name }},

        Thanks for your message. We will contact you as soon as possible.

        Kind regards,\
        {{ config:app:name }}
      show_submitted_data: false
      html: 'peak-tools-email::form'
      text: 'peak-tools-email::form_text'
